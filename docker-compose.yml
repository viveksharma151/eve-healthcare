services:
  db:
    image: postgres:16-alpine
    container_name: eve_healthcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eve_healthcare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: eve_healthcare_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/eve_healthcare
      SECRET_KEY: docker-compose-production-secret-key-change-in-real-prod
      API_V1_STR: /api/v1
    ports:
      - "8000:8000"
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
